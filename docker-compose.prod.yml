services:
  db:
    image: postgres:15-alpine
    container_name: edupulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edupulse
    # DB not exposed publicly in production

  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile.prod
      target: final
    container_name: edupulse-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      APP_URL: ${APP_URL:-https://edupulselms.eu}
      NUXT_APP_URL: ${APP_URL:-https://edupulselms.eu}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-EduPulse <noreply@edupulselms.eu>}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - edupulse

  mailpit:
    image: axllent/mailpit:latest
    container_name: edupulse-mailpit
    restart: unless-stopped
    ports:
      # UI: http://VPS_IP:8025 — emails capturés (pas d'envoi réel)
      - "8025:8025"
    networks:
      - edupulse

  caddy:
    image: caddy:2-alpine
    container_name: edupulse-caddy
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - edupulse

networks:
  edupulse:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

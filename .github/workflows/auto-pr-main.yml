name: Auto PR developp → main

on:
  push:
    branches:
      - developp
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    name: Create or refresh PR to main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure PR developp → main exists
        env:
          # Prefer a PAT (repo secret AUTO_PR_TOKEN) if Actions cannot create PRs.
          # Fallback: GITHUB_TOKEN (needs repo setting enabled — see README).
          GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BASE=main
          HEAD=developp
          TITLE='Release: merge developp into main'
          BODY="$(cat <<'EOF'
          ## Summary
          Mise à jour automatique de `main` depuis `developp`.

          Cette PR est créée / rafraîchie à chaque push ou merge sur `developp`.

          ## Checklist
          - [ ] CI verte sur `developp`
          - [ ] Revue rapide des commits inclus
          - [ ] Merge vers `main` quand prêt pour la prod
          EOF
          )"
          BODY="$(printf '%s\n' "$BODY" | sed -e 's/^[[:space:]]\{0,10\}//')"

          if ! git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
            echo "Branch '$BASE' does not exist on origin — skipping."
            exit 0
          fi

          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$HEAD" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open — refreshing title/body."
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            gh pr view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json url --jq .url
            exit 0
          fi

          AHEAD="$(git rev-list --count "origin/$BASE..origin/$HEAD" 2>/dev/null || echo 0)"
          if [ "$AHEAD" = "0" ]; then
            echo "No commits on $HEAD ahead of $BASE — nothing to PR."
            exit 0
          fi

          set +e
          OUT="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE" \
            --head "$HEAD" \
            --title "$TITLE" \
            --body "$BODY" 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "$OUT"
            exit 0
          fi

          echo "$OUT"
          if echo "$OUT" | grep -qi 'not permitted to create or approve pull requests'; then
            echo ""
            echo "::error::GitHub Actions cannot create PRs with the default GITHUB_TOKEN."
            echo "Fix one of:"
            echo "  1) Repo Settings → Actions → General → Workflow permissions"
            echo "     → enable 'Allow GitHub Actions to create and approve pull requests'"
            echo "     → also choose 'Read and write permissions'"
            echo "  2) Create a classic/fine-grained PAT with 'pull_requests: write' (+ contents read),"
            echo "     then add it as repository secret AUTO_PR_TOKEN"
            exit 1
          fi
          exit "$STATUS"

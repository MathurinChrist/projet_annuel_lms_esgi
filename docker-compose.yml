services:
  db:
    image: postgres:15-alpine
    container_name: lms-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lmsuser -d lmsdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: lms-platform
    restart: always
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-lmsuser}:${DB_PASSWORD:-lmspassword}@db:5432/${DB_NAME:-lmsdb}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-for-dev-only-32chars}
      NODE_ENV: development
      HOST: 0.0.0.0
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_HOST: ${LIVEKIT_HOST:-http://livekit:7880}
    command: sh -c "npx prisma generate && npm run dev"
    volumes:
      - .:/src
      - /src/node_modules
      - /src/.nuxt
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: lms-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lms-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: lms-livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
